<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>LUX.BOX prototype</title>
<style>
  :root { --bg: #0d0d0d; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #stage {
    position: absolute; inset: 0; margin: auto;
    width: min(100vw, calc(100vh * 9 / 16)); height: min(100vh, calc(100vw * 16 / 9));
    background: var(--bg); overflow: hidden;
  }
  @media (max-aspect-ratio: 9/16) { #stage { width: 100vw; height: 100vh; } }
  canvas { display: block; width: 100%; height: 100%; }
  #loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #8a8a8a; font: 300 15px/1.4 'Cormorant Garamond', serif; letter-spacing: .35em; pointer-events: none;
    transition: opacity .4s ease; z-index: 3;
  }
  /* progress bar under LOADING: thin and subtle */
  #loading .loading-in { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #loading .loading-in span { margin-right: -.35em; }      /* the letter spacing leaves a gap after the last letter */
  #bar { width: 96px; height: 1px; background: rgba(255, 255, 255, .10); overflow: hidden; }
  #bar-fill { width: 100%; height: 100%; background: rgba(255, 255, 255, .55); transform: scaleX(0); transform-origin: left;
                 transition: transform .35s ease-out; }
  /* ---- interface: design units (1 Figma pt = --u px; the screen is 360 pt wide) ---- */
  #ui { position: absolute; inset: 0; pointer-events: none; z-index: 2; --u: 1px; }
  #ui .el { position: absolute; left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u));
            width: calc(var(--w) * var(--u)); height: calc(var(--h) * var(--u)); }
  #ui .el > img { display: block; width: 100%; height: 100%; }
  /* Figma's frosted glass (11.32 pt background blur): here the browser does it for real */
  #ui .glass { -webkit-backdrop-filter: blur(calc(11.32 * var(--u))); backdrop-filter: blur(calc(11.32 * var(--u))); }
  #ui .round { border-radius: 50%; }
  #ui .group { transition: opacity .5s linear; }
  #ui .hidden { opacity: 0; }
  #bottom { position: absolute; left: 0; right: 0; bottom: calc(16.33 * var(--u)); height: calc(94.67 * var(--u)); }
  #swiper { position: absolute; left: calc(31.33 * var(--u)); top: 0; width: calc(297.33 * var(--u)); height: 100%; }
  #swiper img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #swipe-word { filter: brightness(1.5); }      /* SWIPE TO OPEN: a lighter grey than the render's */
  #knob-zone { position: absolute; width: calc(65 * var(--u)); height: calc(65 * var(--u)); border-radius: 50%;
               left: calc((47.33 - 32.5) * var(--u)); top: calc((47.33 - 32.5) * var(--u)); pointer-events: auto; cursor: grab; touch-action: none; }
  /* recents: endless strip, draggable with the finger */
  #recents-zone { position: absolute; left: 0; right: 0; top: calc(128 * var(--u)); height: calc(64 * var(--u)); pointer-events: auto; touch-action: none; cursor: grab; }
  #group-recents.hidden #recents-zone { pointer-events: none; }
  /* ---- version B: the sequence is real-time 3D as well ---- */
  canvas { position: relative; z-index: 1; }
  /* intro: while it loads only LOADING shows; then each element enters with its own animation */
  body:not(.ready) #ui { visibility: hidden; }
  body:not(.ready) canvas { opacity: 0; }
  body.entering canvas { transition: opacity 1.3s ease; }
  body.entering #group-recents { animation: fadeIn 1s ease .35s both; }
  body.entering #bottom { animation: riseUp 1.1s cubic-bezier(.22,.8,.3,1) .5s both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes riseUp { from { transform: translateY(130%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  /* detail: back button (the swipe knob, mirrored) and information block */
  #back { position: absolute; left: calc(17.88 * var(--u)); top: calc(114.5 * var(--u)); width: calc(36 * var(--u)); height: calc(36 * var(--u));
            border: 0; padding: 0; background: none; border-radius: 50%; cursor: pointer; opacity: 0; pointer-events: none; }
  #back img { width: 100%; height: 100%; display: block; }
  #info { position: absolute; inset: 0; opacity: 0; font-family: 'Cormorant Garamond', serif; text-align: center; pointer-events: none; }
  #info .t { position: absolute; left: 0; right: 0; transform: translateY(50%); white-space: nowrap; }
  #info-model { bottom: calc(141 * var(--u)); font-weight: 300; font-size: calc(13.5 * var(--u)); color: rgb(151, 151, 151); }
  #info-price { bottom: calc(118.6 * var(--u)); font-weight: 300; font-size: calc(22.5 * var(--u)); color: #fff; }
  #continueBtn { position: absolute; left: calc(32.85 * var(--u)); width: calc(294.3 * var(--u)); height: calc(52.7 * var(--u));
               bottom: calc(27.3 * var(--u)); border: 0; border-radius: 999px; background: #fff; color: rgb(6, 6, 6);
               font: 700 calc(16.4 * var(--u))/1 'Cormorant Garamond', serif; cursor: pointer; }
</style>
<link watch="preconnect" href="https://fonts.googleapis.com">
<link watch="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;700&display=swap">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="loading"><div class="loading-in"><span>LOADING</span><div id="bar"><div id="bar-fill"></div></div></div></div>
  <div id="ui">
    <!-- status bar -->
    <div class="el" style="--x:16.62;--y:13.82;--w:37;--h:20"><img src="ui/time.png" alt=""></div>
    <div class="el" style="--x:276.3;--y:21;--w:18;--h:11"><img src="ui/signal.png" alt=""></div>
    <div class="el" style="--x:300.08;--y:21.03;--w:16;--h:12"><img src="ui/wifi.png" alt=""></div>
    <div class="el" style="--x:322.33;--y:20.26;--w:25;--h:12"><img src="ui/battery.png" alt=""></div>
    <!-- header: logo, balance, speaker, menu -->
    <div id="group-header" class="group">
      <div class="el" style="--x:17.88;--y:62.47;--w:119;--h:17"><img src="ui/logo.png" alt="LUX.BOX"></div>
      <div class="el glass" style="--x:187.26;--y:57.56;--w:86;--h:29;border-radius:calc(14.5 * var(--u))"><img src="ui/balance.png" alt=""></div>
      <div class="el glass round" style="--x:281.43;--y:57.56;--w:29;--h:29"><img src="ui/speaker.png" alt=""></div>
      <div class="el glass round" style="--x:319.26;--y:57.56;--w:29;--h:29"><img src="ui/menu.png" alt=""></div>
    </div>
    <!-- recents: title and cards -->
    <div id="group-recents" class="group">
      <div class="el" style="--x:17.88;--y:110.05;--w:88;--h:11"><img src="ui/recents.png" alt="Recently Acquired"></div>
      <div class="el glass card" style="--x:-32.32;--y:133.08;--w:104;--h:54;border-radius:calc(9.43 * var(--u))"><img src="ui/card.png" alt=""></div>
      <div class="el glass card" style="--x:79.28;--y:133.08;--w:104;--h:54;border-radius:calc(9.43 * var(--u))"><img src="ui/card.png" alt=""></div>
      <div class="el glass card" style="--x:190.88;--y:133.08;--w:104;--h:54;border-radius:calc(9.43 * var(--u))"><img src="ui/card.png" alt=""></div>
      <div class="el glass card" style="--x:302.48;--y:133.08;--w:104;--h:54;border-radius:calc(9.43 * var(--u))"><img src="ui/card.png" alt=""></div>
      <div class="el glass card" style="--x:414.08;--y:133.08;--w:104;--h:54;border-radius:calc(9.43 * var(--u))"><img src="ui/card.png" alt=""></div>
      <div id="recents-zone" aria-label="Recently Acquired"></div>
    </div>
    <!-- bottom swiper (layers rendered in Cycles) -->
    <div id="bottom" class="group">
      <div id="swiper">
        <img src="ui/swipe_pill.png" alt="">
        <!-- ON state from your timeline (rims 0.29 -> 0.56, arrow 2.4 -> 50.5): cross-faded with the knob -->
        <img id="swipe-pill-on" src="ui/swipe_pill_on.png" alt="" style="opacity:0">
        <img id="swipe-word" src="ui/swipe_word.png" alt="SWIPE">
        <img id="swipe-knob" src="ui/swipe_knob.png" alt="">
        <img id="swipe-knob-on" src="ui/swipe_knob_on.png" alt="" style="opacity:0">
        <!-- arrow light: a halo that grows with the knob -->
        <img id="swipe-arrow-glow" src="ui/swipe_arrow_glow.png" alt="" style="opacity:0">
        <div id="knob-zone" aria-label="Swipe to open"></div>
      </div>
    </div>
    <!-- detail -->
    <button id="back" aria-label="Back"><img src="ui/back_on.png" alt=""></button>
    <div id="info">
      <div class="t" id="info-model">Lorem ipsum dolor sit amet</div>
      <div class="t" id="info-price">Lorem ipsum</div>
      <button id="continueBtn">Continue</button>
    </div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

// opened as a file (double click): the browser blocks loading the models; it has to be served over http
if (location.protocol === 'file:') {
  document.getElementById('loading').innerHTML =
    'Open it from<br><b style="color:#ddd">http://localhost:8791</b><br><span style="font-size:12px">(opened as a file, the browser blocks the 3D models)</span>';
  throw new Error('opened as a file');
}

// ---- settings (can be changed from the URL: ?light=1.2&exp=1&reflect=0.35&bloom=0.4) ----
const P = new URLSearchParams(location.search);
const SETTINGS = {
  light:   parseFloat(P.get('light')   ?? 1.0),   // multiplier for Blender's lights
  env: parseFloat(P.get('env') ?? 1.0),   // environment reflection intensity
  exp:    parseFloat(P.get('exp')    ?? 1.0),   // exposure (AgX)
  reflect: parseFloat(P.get('reflect') ?? 0.34),  // floor reflection strength (-15% and then -20%)
  bloom:  parseFloat(P.get('bloom')  ?? 0.2),  // glow strength
};
const STEP = THREE.MathUtils.degToRad(45);       // 8 boxes, 45 degrees apart
const DIR = parseFloat(P.get("dir") ?? 1);       // turn direction relative to the finger
const SPEED = parseFloat(P.get("speed") ?? 1.782);   // speed of the way back (1 = your timeline's)
// the opening runs faster, and faster still at the start (290 -> 620): light but not rushed
const SPEED_OPEN = parseFloat(P.get("speed_open") ?? 1.936), PUSH = parseFloat(P.get("push") ?? 1.0);
if (P.get('ui') === '0') document.getElementById('ui').style.display = 'none';   // tests: no interface

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
// the final tone comes from Blender's AgX LUT (last composer hiPass), not three.js's AgX
renderer.toneMapping = THREE.NoToneMapping;
stage.insertBefore(renderer.domElement, stage.firstChild);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0.023, 0.023, 0.023);   // Blender's world: 0.004 x 5.7

let camera, circle, q0, composer, angle = 0, goal = 0, angVel = 0;
const HFOV_DESIGN = null;   // computed from Blender's camera (9:16 vertical fit)

const pmrem = new THREE.PMREMGenerator(renderer);
// ---- loading progress bar: approximate size of each file (KB) ----
const barFill = document.getElementById('bar-fill');
const WEIGHTS = { env: 395, glb: 2620, emission: 19, lut: 432, lutjs: 1, data: 905, watch: 892, liningB: 19, liningT: 18, ao: 221 };
const got = {}, weightTotal = Object.values(WEIGHTS).reduce((a, b) => a + b, 0);
function showProgress() {
  let s = 0; for (const k in WEIGHTS) s += WEIGHTS[k] * (got[k] || 0);
  if (barFill) barFill.style.transform = `scaleX(${(s / weightTotal).toFixed(3)})`;
}
const onProgress = k => e => { if (e && e.total) { got[k] = Math.min(0.99, e.loaded / e.total); showProgress(); } };
const onDone = k => x => { got[k] = 1; showProgress(); return x; };
const [hdr, gltf, seamMask, lutBin, lutInfo] = await Promise.all([
  new RGBELoader().loadAsync(P.get('env') || 'env.hdr', onProgress('env')).then(onDone('env')),
  new GLTFLoader().loadAsync('luxbox.glb', onProgress('glb')).then(onDone('glb')),
  new THREE.TextureLoader().loadAsync('Box_Base_emission.png').then(onDone('emission')),
  fetch('agx_lut.bin').then(r => r.arrayBuffer()).then(onDone('lut')),
  fetch('agx_lut.json').then(r => r.json()).then(onDone('lutjs')),
]);
const lut = new THREE.Data3DTexture(new Uint8Array(lutBin), lutInfo.N, lutInfo.N, lutInfo.N);
lut.format = THREE.RGBAFormat; lut.type = THREE.UnsignedByteType;
lut.minFilter = lut.magFilter = THREE.LinearFilter;
lut.wrapS = lut.wrapT = lut.wrapR = THREE.ClampToEdgeWrapping;
lut.unpackAlignment = 1; lut.needsUpdate = true;
hdr.mapping = THREE.EquirectangularReflectionMapping;
scene.environment = pmrem.fromEquirectangular(hdr).texture;
scene.environmentIntensity = SETTINGS.env;
hdr.dispose();
// the carousel is drawn with the same light as the sequence (real 3D wall, Blender's world):
// the last frame of one part and the first of the other are identical

scene.add(gltf.scene);
circle = gltf.scene.getObjectByName('Circle');
camera = gltf.cameras[0];
q0 = circle.quaternion.clone();

// Blender's lights: the glTF exporter turns watts into candela by multiplying by 683 (luminous efficacy)
// and applies the exposure as well; three.js does not undo the 683, so we divide it out here.
// The 8 interior lights (one inside each box) are left out of the carousel: with no shadows they would shine through the walls;
// in Cycles they only show through the seam, which here is done by the emissive material. They come back in step 2, inside the open box.
const INTERIORS = /^Point\.?(006|009|010|011|012|013|014|015)$/;
const drop = [];
gltf.scene.traverse(o => {
  if (o.isLight) {
    const objName = o.userData.name || o.name;
    if (INTERIORS.test(objName)) { drop.push(o); return; }
    o.intensity *= SETTINGS.light / 683; o.castShadow = false;
    // the light comes from the environment; only Point.018 (small, next to the camera) stays direct: it makes the shine
    // on the polished metal (clasp and logos), which covers less than a pixel in the environment map. ?lights=1 keeps them all
    if (P.get('lights') !== '1' && !/^Point\.?018$/.test(objName)) drop.push(o);
  }
  if (o.isMesh) {
    o.frustumCulled = true;
    const m = o.material;
    // the emissive icosphere in your scene only lights up while box .008 opens (off at 462): it is not used here
    if (/^Icosphere/.test(o.userData.name || o.name)) o.visible = false;
  }
});
drop.forEach(o => o.parent.remove(o));
// the 3D wall is always drawn (carousel and sequence) and hides the boxes at the back of the ring, as in Cycles
const wall = gltf.scene.getObjectByName('Wall_Frosted_Glass');
if (wall) wall.traverse(o => { if (o.isMesh) { o.userData.matOriginal = o.material; o.renderOrder = -1; } });
// seam: the silver profile glows from the interior light (in Cycles); here, an emissive mask
seamMask.flipY = false; seamMask.colorSpace = THREE.NoColorSpace;
SETTINGS.seam = parseFloat(P.get('seam') ?? 0.8);
// The boxes are lit only by the environment map (captured in Cycles with the lights as spheres, calibrated).
// The map is captured from a single point; these per-material factors line it up with the measurements from the Cycles render.
// calibrated against the Cycles render of frame 1 (measurements in ref/): body 19.7, lid 25.3, clasp 114.8, logos 22.7
const REFLECT_MATERIAL = Object.assign({ 'Box_Base': 1.83, 'Box_Lid': 1.4, 'Clasp_Polished_Steel.004': 6.5, 'Silver_Edge': 2.15 },
                                      JSON.parse(P.get('rm') ?? '{}'));
// (three.js ignores envMapIntensity when the environment is only on scene.environment: it is set per material)
const texEnv = scene.environment;
const matsEnv = new Set();   // the lights hang from Circle: the environment turns with the carousel
gltf.scene.traverse(o => {
  if (!o.isMesh || !o.material || !o.material.isMeshStandardMaterial) return;
  o.material.envMap = texEnv;
  const f = REFLECT_MATERIAL[o.material.name] ?? 1;
  o.material.envMapIntensity = f * SETTINGS.env * parseFloat(P.get('env_' + o.material.name) ?? 1);
  matsEnv.add(o.material);
});
gltf.scene.traverse(o => {
  if (o.isMesh && o.material && o.material.name === 'Box_Base') {
    o.material.emissive = new THREE.Color(1, 1, 1);
    o.material.emissiveMap = seamMask;
    o.material.emissiveIntensity = SETTINGS.seam;
    o.material.needsUpdate = true;
  }
});

// ---- reflecting floor: a Reflector plane just under the boxes, fading out ----
const boxes = [];
// GLTFLoader strips the dots from names ("MASTER_Base.001" -> "MASTER_Base001"); the original stays in userData.name
gltf.scene.traverse(o => { if (/^MASTER_Base\.?\d{3}$/.test(o.userData.name || o.name)) boxes.push(o); });
if (!boxes.length) throw new Error('Boxes not found in the GLB');
const bb = new THREE.Box3(); boxes.forEach(c => bb.expandByObject(c));
const floorY = bb.min.y + 0.002;
const ringCenter = new THREE.Vector3(); circle.getWorldPosition(ringCenter);
const mirror = new Reflector(new THREE.CircleGeometry(30, 64), {
  textureWidth: 512, textureHeight: 512, clipBias: 0.003, color: 0xffffff,
  shader: {
    name: 'FloorReflect',
    uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null },
                strength: { value: SETTINGS.reflect }, compress: { value: parseFloat(P.get('reflect_light') ?? 1.5) }, center: { value: ringCenter }, radius: { value: parseFloat(P.get('reflect_radius') ?? 26.0) } },   // the reflection fades far from the ring, not under the boxes
    vertexShader: `
      uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vPos;
      void main() { vUv = textureMatrix * vec4(position, 1.0);
        vPos = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform float strength, compress; uniform vec3 center; uniform float radius;
      varying vec4 vUv; varying vec3 vPos;
      void main() {
        vec4 r = texture2DProj(tDiffuse, vUv);
        r.rgb = r.rgb / (1.0 + r.rgb * compress);
        float d = length(vPos.xz - center.xz) / radius;
        float fade = strength * (1.0 - smoothstep(0.55, 1.0, d));
        // only where a box is reflected (alpha of the reflection render); the background carries its own reflection
        gl_FragColor = vec4(r.rgb, fade * r.a);
      }`,
  },
});
// the reflection is rendered without the background (which already includes the wall's reflection) and with alpha 0 where there is nothing
const mirrorRenderOriginal = mirror.onBeforeRender;
mirror.onBeforeRender = function (...a) {
  const bg = scene.background, ca = renderer.getClearAlpha(), cc = renderer.getClearColor(new THREE.Color());
  scene.background = null; renderer.setClearColor(0x000000, 0);
  // the wall is kept out of the reflection: it is stuck to the camera and was cutting the reflection of the boxes behind
  const withWall = P.get('wall_reflect') === '1';
  if (wall && !withWall) wall.visible = false;
  mirrorRenderOriginal.apply(this, a);
  if (wall) wall.visible = true;
  scene.background = bg; renderer.setClearColor(cc, ca);
};
mirror.material.transparent = true;
mirror.material.depthWrite = false;
mirror.rotation.x = -Math.PI / 2;
mirror.position.set(ringCenter.x, floorY, ringCenter.z);
mirror.renderOrder = 1;
scene.add(mirror);

// ---- post-processing: glow only on the very bright, and AgX at the end ----
composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), SETTINGS.bloom, 0.45, parseFloat(P.get('threshold') ?? 0.92));
// the glow used to switch on at once when it crossed the threshold: on a seam that shines a little more at one side, the pulse made
// the light run along the edge (right to left on the first box). With a soft knee it grows and fades the same everywhere
bloom.highPassUniforms.smoothWidth.value = parseFloat(P.get('knee') ?? 0.01);
// The glow is computed at half resolution: the original hiPass averages 4 pixels and THEN applies the threshold.
// A thin line like the seam, depending on how it falls between two rows of pixels, was watered down in stretches: along the edge
// the pulse crossed the threshold at different moments and the light "ran" (on the first box, which falls between two rows).
// Here the threshold is applied pixel by pixel and the average comes after: it no longer depends on where the line falls.
if (P.get('glow_old') !== '1') {
  bloom.highPassUniforms.texelIn = { value: new THREE.Vector2() };
  bloom.materialHighPassFilter.fragmentShader = `
    uniform sampler2D tDiffuse; uniform vec3 defaultColor; uniform float defaultOpacity;
    uniform float luminosityThreshold; uniform float smoothWidth; uniform vec2 texelIn;
    varying vec2 vUv;
    vec4 hiPass(vec2 uv) {
      vec4 t = texture2D(tDiffuse, uv);
      float v = dot(t.rgb, vec3(0.2126729, 0.7151522, 0.0721750));
      return mix(vec4(defaultColor.rgb, defaultOpacity), t, smoothstep(luminosityThreshold, luminosityThreshold + smoothWidth, v));
    }
    void main() {
      vec2 d = 0.5 * texelIn;
      gl_FragColor = 0.25 * (hiPass(vUv + vec2(-d.x, -d.y)) + hiPass(vUv + vec2(d.x, -d.y))
                           + hiPass(vUv + vec2(-d.x, d.y)) + hiPass(vUv + vec2(d.x, d.y)));
    }`;
  bloom.materialHighPassFilter.needsUpdate = true;
}
composer.addPass(bloom);
// Blender's AgX: log2 of the light -> 3D LUT generated with the same OCIO -> screen sRGB
const passAgX = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, lut: { value: lut }, exposure: { value: SETTINGS.exp },
              minEV: { value: lutInfo.minEV }, maxEV: { value: lutInfo.maxEV }, N: { value: lutInfo.N } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    precision highp sampler3D;
    uniform sampler2D tDiffuse; uniform sampler3D lut;
    uniform float exposure, minEV, maxEV, N; varying vec2 vUv;
    float grain(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){

  const dt = Math.min(0.05, (t - tPrev) / 1000); tPrev = t;

  if (mode === 'carousel') {
    if (intro && !drag) {
      const k = THREE.MathUtils.clamp((t - intro.t0) / intro.ms, 0, 1);
      angle = goal + intro.off * Math.pow(1 - k, 3); angVel = 0;
      if (k >= 1) intro = null;
    } else if (!drag) {
      // critically damped spring towards the snap
      const k = 90, c = 2 * Math.sqrt(k);
      const acc = -k * (angle - goal) - c * angVel;
      angVel += acc * dt; angle += angVel * dt;
      if (Math.abs(angle - goal) < 1e-5 && Math.abs(angVel) < 1e-4) { angle = goal; angVel = 0; }
    } else angVel = 0;
    layout(angle);
    updateBrightness(t);
    crackOpen();
  } else {
    const f = fCur = Math.min(fSeqEnd, fCur + dt * FPS * seqSpeed(fCur));
    applyFrame(f);
    if (f >= fSeqEnd) {
      if (fSeqEnd === WAIT && state === 'sequence') { state = 'detail'; applyFrame(f); }
      else if (fSeqEnd === F1) endSequence();
    }
  }
  hideBehind(composer.passes[0].camera);
  composer.render();
  if (introFrames >= 0 && ++introFrames === 2) { introFrames = -1; startIntro(); }
  requestAnimationFrame(frame);
}
// ---- intro ----
const INTRO_OFF = parseFloat(P.get('intro') ?? 0.9);
let intro = null;
let introFrames = 0;
function startIntro() {
  const loading = document.getElementById('loading');
  loading.style.opacity = 0; setTimeout(() => loading.remove(), 450);
  document.body.classList.add('ready', 'entering');
  intro = { t0: performance.now(), ms: 1500, off: DIR * SIGN * INTRO_OFF * STEP };
  // the bottom swiper's animation must not stay stuck: the exit one is driven by its own .animate()
  setTimeout(() => { document.body.classList.remove('entering'); }, 2000);
}
// the boxes wait out of place; the intro starts once two frames have been drawn (compiling the
// first frame's shaders must not eat into the animation)
intro = { t0: Infinity, ms: 1500, off: DIR * SIGN * INTRO_OFF * STEP };
angle = goal + intro.off; layout(angle);
requestAnimationFrame(frame);

// for automated tests
window.__proto = { THREE, scene, camera, gltf, SETTINGS, state: () => ({ angle, goal, boxes: boxes.length, SIGN, state, swipeProgress, mode, seqFrame, A8 }),
  turn: n => { goal += n * STEP; }, open, backToCarousel,
  activeCam: () => composer.passes[0].camera,
  boxPositions: () => boxes.map(c => { c.updateMatrixWorld(true); return new THREE.Vector3().setFromMatrixPosition(c.matrixWorld).toArray(); }),
  setKnob: setSwipe, holdPulse: v => { pulseHold = v; }, lidClosed: () => lidClosed,
  jumpTo: f => { if (mode !== 'seq') startSequence(); fCur = f; fSeqEnd = f; } };
</script>
